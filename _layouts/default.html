<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f2">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.title != '홈' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="SolongoS 무지개 나라 홈"><span class="brand-icon" aria-hidden="true">✳</span><span>SolongoS<span class="brand-dot">.</span></span></a>
        <nav class="site-nav" aria-label="주 메뉴">
          <a href="{{ '/' | relative_url }}">홈</a>
          <a href="{{ '/#posts' | relative_url }}">최근 글</a>
          <a href="{{ '/classic/' | relative_url }}">고전 문장</a>
          <a href="{{ '/#about' | relative_url }}">소개</a>
        </nav>
      </div>
    </header>
    <main id="main" class="shell">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <span>© {{ 'now' | date: '%Y' }} SolongoS</span>
        <span>작은 기록이 모여 무지개가 됩니다 <span aria-hidden="true">✳</span></span>
      </div>
    </footer>
  </body>
</html>
