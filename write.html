---
layout: default
title: 새 글 쓰기
permalink: /write/
---

<section class="writer" aria-labelledby="writer-title">
  <div class="writer-heading">
    <p class="section-kicker">NEW STORY</p>
    <h1 id="writer-title">새 글 쓰기</h1>
    <p>제목과 내용을 적으면 게시할 글 파일을 만들어 드립니다. 코드를 입력할 필요는 없어요.</p>
  </div>

  <form id="post-form" class="writer-form">
    <div class="writer-row">
      <label>제목 <input name="title" type="text" maxlength="120" placeholder="글 제목을 입력하세요" required></label>
      <label>분류 <input name="category" type="text" maxlength="40" placeholder="예: 일상, 배움" value="일상" required></label>
    </div>
    <label>날짜 <input name="date" type="date" required></label>
    <label>짧은 소개 <input name="description" type="text" maxlength="160" placeholder="비워 두면 본문 첫 부분이 사용됩니다"></label>
    <label>본문 <textarea name="body" rows="15" placeholder="여기에 글을 쓰세요. 문단 사이에 빈 줄을 넣으면 읽기 편합니다." required></textarea></label>
    <button class="button button-primary" type="submit">글 파일 내려받기 <span aria-hidden="true">↓</span></button>
    <p id="download-status" class="writer-status" role="status" aria-live="polite"></p>
  </form>

  <div class="writer-publish">
    <span class="writer-step">마지막 단계</span>
    <h2>파일을 올리면 글이 게시됩니다.</h2>
    <p>위에서 내려받은 <code>.md</code> 파일을 GitHub에 업로드하고 <strong>Commit changes</strong>를 누르세요. 로그인은 이 블로그 저장소에 글을 올릴 수 있는 GitHub 계정으로 해야 합니다.</p>
    <a class="button button-outline" href="https://github.com/solongos7/solongos7.github.io/upload/main/_posts">GitHub에 파일 올리기 <span aria-hidden="true">↗</span></a>
  </div>
</section>

<script src="{{ '/assets/js/write.js' | relative_url }}" defer></script>
